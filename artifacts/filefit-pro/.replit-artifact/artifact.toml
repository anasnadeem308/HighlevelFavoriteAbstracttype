kind = "web"
previewPath = "/"
title = "FileFit Pro"
description = "A privacy-first image utility website with browser-only compression, passport photo resizing, CNIC merging, and metadata removal tools."
version = "1.0.0"
id = "artifacts/filefit-pro"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19778

[services.development]
run = "pnpm --filter @workspace/filefit-pro run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/filefit-pro", "run", "build" ]
serve = "static"
publicDir = "artifacts/filefit-pro/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19778"
BASE_PATH = "/"
